<style>
/* ───────── 토큰 ───────── */
:root{
  --ink:      #101119;   /* 지면 */
  --panel:    #171923;   /* 카드 */
  --panel-2:  #1D202C;   /* 카드 hover */
  --rule:     #2A2E3C;   /* 괘선 */
  --bone:     #E9E5DA;   /* 본문 */
  --muted:    #7E828F;   /* 보조 텍스트 */
  --brass:    #C39A45;   /* 봉인 도장 — 유일한 강조색 */
  --brass-dim:#6E5726;

  --serif: "Noto Serif KR", serif;
  --sans:  "Pretendard Variable", Pretendard, system-ui, sans-serif;
  --mono:  "IBM Plex Mono", ui-monospace, monospace;

  --unit: 8px;
}

*{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  background:
    linear-gradient(transparent 7px, rgba(255,255,255,.014) 7px) 0 0/100% 8px,
    linear-gradient(90deg, transparent 7px, rgba(255,255,255,.014) 7px) 0 0/8px 100%,
    var(--ink);
  color:var(--bone);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
}

.wrap{ max-width:1180px; margin:0 auto; padding:0 24px 96px; }

/* ───────── 머리말 ───────── */
.masthead{ padding:56px 0 36px; border-bottom:1px solid var(--rule); }

.eyebrow{
  font-family:var(--mono); font-size:11px; font-weight:600;
  letter-spacing:.22em; text-transform:uppercase; color:var(--brass);
  margin:0 0 14px;
}

.masthead h1{
  font-family:var(--serif); font-weight:900;
  font-size:clamp(30px, 4.4vw, 44px); line-height:1.15;
  letter-spacing:-.03em; margin:0 0 18px;
}

.lede{ max-width:52ch; color:var(--muted); margin:0 0 32px; font-size:15px; }
.lede strong{ color:var(--bone); font-weight:600; }

/* 눈금 진행 레일 — 한 눈금이 전설 한 마리 */
.rail{ display:flex; gap:3px; align-items:flex-end; height:26px; margin-bottom:14px; }
.tick{ flex:1 1 0; height:11px; background:var(--rule); border-radius:1px; transition:height .5s ease, background .5s ease; }
.tick.on{ height:26px; background:var(--brass); }

.tally{ font-family:var(--mono); font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 18px; }
.tally b{ color:var(--bone); font-weight:600; }
.tally .sealed b{ color:var(--brass); }

/* ───────── 격자판 ───────── */
.board-head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:56px 0 16px; flex-wrap:wrap; }

h2{
  font-family:var(--serif); font-weight:900; font-size:22px;
  letter-spacing:-.02em; margin:0;
}

.hint{ font-family:var(--mono); font-size:11.5px; color:var(--muted); }

.board{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(152px,1fr));
  gap:1px; background:var(--rule); border:1px solid var(--rule);
}

.cell{
  aspect-ratio:1; background:var(--panel); border:0; cursor:pointer;
  position:relative; padding:14px 10px 12px; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  transition:background .15s ease;
}
.cell:hover, .cell:focus-visible{ background:var(--panel-2); outline:none; }
.cell:focus-visible{ box-shadow:inset 0 0 0 2px var(--brass); }

.cell .sprite{ flex:1 1 auto; min-height:0; width:100%; display:grid; place-items:center; }
/* PokeAPI 스프라이트는 이미지 안에 여백이 넓어서 1.35배로 늘려 잘라냅니다.
   픽셀몬 원본(local)을 쓰면 scale(1) 로 바꾸세요. */
.cell .sprite img{
  max-width:100%; max-height:100%; object-fit:contain;
  image-rendering:pixelated; transform:scale(1.35);
}
.cell.sealed .sprite img{ filter:grayscale(1) brightness(.5); }

.cell .label{
  font-family:var(--mono); font-size:12px; line-height:1.3; color:var(--muted);
  max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  position:relative; z-index:1;
}
.cell.sealed .label{ color:var(--brass-dim); }

.cell.sealed::after{
  content:""; position:absolute; top:0; right:0;
  border-width:0 16px 16px 0; border-style:solid;
  border-color:transparent var(--brass) transparent transparent;
}
.cell .fallback{ font-family:var(--mono); font-size:13px; color:var(--muted); }

/* ───────── 조작부 ───────── */
.controls{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  margin:56px 0 24px; padding-bottom:24px; border-bottom:1px solid var(--rule);
}

.seg{ display:flex; border:1px solid var(--rule); }
.seg button{
  font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.04em;
  background:transparent; color:var(--muted); border:0; padding:9px 15px; cursor:pointer;
  transition:color .15s ease, background .15s ease;
}
.seg button + button{ border-left:1px solid var(--rule); }
.seg button:hover{ color:var(--bone); }
.seg button[aria-pressed="true"]{ background:var(--brass); color:var(--ink); }
.seg button:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }

.search{
  flex:1 1 200px; min-width:180px;
  background:var(--panel); border:1px solid var(--rule); color:var(--bone);
  font-family:var(--mono); font-size:13px; padding:9px 13px;
}
.search::placeholder{ color:var(--muted); }
.search:focus{ outline:none; border-color:var(--brass); }

.gens{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:32px; }
.gen{
  font-family:var(--mono); font-size:11.5px; font-weight:600;
  background:transparent; color:var(--muted);
  border:1px solid var(--rule); padding:6px 11px; cursor:pointer;
  transition:color .15s ease, border-color .15s ease;
}
.gen:hover{ color:var(--bone); border-color:var(--muted); }
.gen[aria-pressed="true"]{ color:var(--brass); border-color:var(--brass); }
.gen:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }

/* ───────── 등록 카드 ───────── */
.register{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }

.entry{
  background:var(--panel); padding:22px; position:relative; overflow:hidden;
  display:grid; grid-template-columns:88px 1fr; gap:18px; align-items:start;
  transition:background .15s ease;
}
.entry:hover{ background:var(--panel-2); }

.portrait{ width:88px; height:88px; display:grid; place-items:center; }
.portrait img{ width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
.portrait .fallback{ font-family:var(--mono); font-size:12px; color:var(--muted); }

.entry.sealed .portrait img{ filter:grayscale(1) brightness(.42); }

.meta{ min-width:0; }

.dexno{
  font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.16em;
  color:var(--muted); display:block; margin-bottom:3px;
}
.entry.sealed .dexno{ color:var(--brass-dim); }

.name{
  font-family:var(--serif); font-weight:900; font-size:23px; letter-spacing:-.02em;
  line-height:1.2; margin:0 0 10px; word-break:keep-all;
}
.entry.sealed .name{ color:var(--muted); }

.status{ font-family:var(--mono); font-size:12px; color:var(--muted); }
.status .open{ color:var(--bone); }

/* 도장 — 이 페이지의 서명 */
.stamp{
  display:inline-block; margin-top:2px;
  border:2px solid var(--brass); color:var(--brass);
  padding:5px 11px 4px; transform:rotate(-3.5deg);
  font-family:var(--mono); font-weight:600; letter-spacing:.06em;
  line-height:1.35; text-align:center;
}
.stamp .who{ font-size:14px; display:block; }
.stamp .when{ font-size:10px; display:block; color:var(--brass-dim); letter-spacing:.14em; }

.empty{
  grid-column:1/-1; background:var(--panel); padding:64px 24px; text-align:center;
  font-family:var(--mono); font-size:13px; color:var(--muted);
}

/* ───────── 소유자 ───────── */
.owners{ margin-top:72px; }
.owner-list{ list-style:none; padding:0; margin:20px 0 0; border-top:1px solid var(--rule); }
.owner-list li{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:14px 0; border-bottom:1px solid var(--rule);
}
.owner-name{ font-family:var(--serif); font-weight:900; font-size:17px; }
.owner-count{ font-family:var(--mono); font-size:12px; color:var(--brass); }
.owner-mons{ font-family:var(--mono); font-size:12px; color:var(--muted); flex:1 1 100%; }

/* ───────── 난이도 ───────── */
.diff{
  display:inline-flex; align-items:center; gap:7px;
  font-family:var(--mono); font-size:11px; letter-spacing:.04em;
}
.pips{ display:inline-flex; gap:2px; }
.pip{ width:6px; height:11px; background:var(--rule); border-radius:1px; }
.pip.on{ background:var(--dc, var(--brass)); }
.diff .dname{ color:var(--dc, var(--muted)); }
.diff.none .dname{ color:var(--muted); }

/* 격자 칸 안의 축소판 */
.cell .diff{ font-size:0; gap:0; }
.cell .pip{ width:5px; height:8px; }
.cell .pips{ gap:2px; }

/* 등록 카드 안 */
.entry .diff{ margin-top:9px; }

/* 난이도 요약 막대 */
.spread{ display:flex; gap:1px; margin:20px 0 0; border:1px solid var(--rule); }
.spread .seg-bar{
  flex:1 1 0; padding:11px 8px; background:var(--panel);
  font-family:var(--mono); font-size:11px; text-align:center; line-height:1.5;
}
.spread .seg-bar b{ display:block; font-size:16px; font-weight:600; }

/* ───────── 티어표 ───────── */
.tiers{ display:flex; flex-direction:column; gap:1px; background:var(--rule); border:1px solid var(--rule); }

.tier{ display:grid; grid-template-columns:104px 1fr; background:var(--panel); min-height:96px; }

.tier-tag{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:12px 8px; text-align:center;
  background:var(--tc, var(--rule)); color:#12131A;
}
.tier-tag .rank{ font-family:var(--serif); font-weight:900; font-size:30px; line-height:1; }
.tier-tag .rname{ font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.06em; }
.tier-tag .rcount{ font-family:var(--mono); font-size:10px; opacity:.62; }

.tier.undecided .tier-tag{ background:var(--rule); color:var(--muted); }
.tier.undecided .tier-tag .rank{ font-size:20px; }

.tier-body{
  display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px;
  padding:12px; min-width:0;
}

.chip{
  position:relative; width:66px; background:transparent; border:1px solid transparent;
  padding:4px 2px 5px; cursor:pointer; border-radius:2px;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  transition:background .14s ease, border-color .14s ease;
}
.chip:hover, .chip:focus-visible{ background:var(--panel-2); border-color:var(--rule); outline:none; }
.chip:focus-visible{ border-color:var(--brass); }

.chip .sprite{ width:46px; height:46px; display:grid; place-items:center; overflow:hidden; }
.chip .sprite img{ max-width:100%; max-height:100%; object-fit:contain; image-rendering:pixelated; transform:scale(1.35); }
.chip.sealed .sprite img{ filter:grayscale(1) brightness(.5); }

.chip .cname{
  font-family:var(--mono); font-size:9.5px; line-height:1.25; color:var(--muted);
  max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chip.sealed .cname{ color:var(--brass-dim); }

.chip.sealed::after{
  content:""; position:absolute; top:3px; right:3px;
  width:0; height:0; border-width:0 8px 8px 0; border-style:solid;
  border-color:transparent var(--brass) transparent transparent;
}

.tier-empty{
  font-family:var(--mono); font-size:11.5px; color:var(--muted);
  align-self:center; padding:6px 2px;
}

/* 보기 전환 */
.viewtabs{ display:flex; border:1px solid var(--rule); }
.viewtabs button{
  font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.04em;
  background:transparent; color:var(--muted); border:0; padding:7px 14px; cursor:pointer;
  transition:color .15s ease, background .15s ease;
}
.viewtabs button + button{ border-left:1px solid var(--rule); }
.viewtabs button:hover{ color:var(--bone); }
.viewtabs button[aria-pressed="true"]{ background:var(--brass); color:var(--ink); }
.viewtabs button:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }

.hidden{ display:none !important; }

/* ───────── 등장 ───────── */
@keyframes rise{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:none; } }
.anim{ animation:rise .45s cubic-bezier(.2,.7,.3,1) both; }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

@media (max-width:560px){
  .wrap{ padding:0 16px 64px; }
  .masthead{ padding:40px 0 28px; }
  .board{ grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); }
  .cell{ padding:10px 6px 9px; gap:4px; }
  .cell .label{ font-size:10.5px; }
  .tier{ grid-template-columns:72px 1fr; min-height:82px; }
  .tier-tag{ padding:10px 6px; }
  .tier-tag .rank{ font-size:24px; }
  .tier-tag .rname{ font-size:9.5px; }
  .tier-body{ padding:9px; gap:4px; }
  .chip{ width:56px; }
  .chip .sprite{ width:40px; height:40px; }
  .entry{ grid-template-columns:64px 1fr; gap:14px; padding:18px; }
  .portrait{ width:64px; height:64px; }
  .name{ font-size:20px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <p class="eyebrow">마켓몬 서버</p>
    <h1>전설 소유권 등록부</h1>
    <p class="lede">
      각 전설에는 고유한 획득 기믹이 하나씩 걸려 있습니다.
      <strong>가장 먼저 완수한 사람이 영구 소유자</strong>가 되고, 그 순간 기믹은 닫혀 다시 열리지 않습니다.
      아래에서 아직 색이 살아있는 쪽이 남아있는 자리입니다.
    </p>
    <div class="rail" id="rail" aria-hidden="true"></div>
    <p class="tally" id="tally"></p>
  </header>

  <section aria-labelledby="board-title">
    <div class="board-head">
      <h2 id="board-title">전체 배치</h2>
      <div class="viewtabs" role="group" aria-label="보기 전환">
        <button type="button" data-view="grid" aria-pressed="true">격자</button>
        <button type="button" data-view="tier" aria-pressed="false">티어표</button>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="tiers hidden" id="tiers"></div>
    <div class="spread" id="spread"></div>
  </section>

  <section aria-labelledby="reg-title">
    <div class="board-head">
      <h2 id="reg-title">등록 내역</h2>
      <span class="hint" id="regcount"></span>
    </div>

    <div class="controls">
      <div class="seg" role="group" aria-label="상태 필터">
        <button type="button" data-state="all"    aria-pressed="true">전체</button>
        <button type="button" data-state="open"   aria-pressed="false">미청구</button>
        <button type="button" data-state="sealed" aria-pressed="false">봉인됨</button>
      </div>
      <div class="seg" role="group" aria-label="정렬">
        <button type="button" data-sort="dex"  aria-pressed="true">도감순</button>
        <button type="button" data-sort="new"  aria-pressed="false">봉인 최신순</button>
        <button type="button" data-sort="diff" aria-pressed="false">난이도순</button>
        <button type="button" data-sort="name" aria-pressed="false">이름순</button>
      </div>
      <input class="search" id="q" type="search" placeholder="전설 이름 또는 소유자 검색" aria-label="검색">
    </div>

    <div class="gens" id="gens" role="group" aria-label="세대 필터"></div>
    <div class="gens" id="diffs" role="group" aria-label="난이도 필터"></div>

    <div class="register" id="register"></div>
  </section>

  <section class="owners" aria-labelledby="own-title">
    <h2 id="own-title">소유자</h2>
    <ul class="owner-list" id="owners"></ul>
  </section>

</div>

<script>
(() => {
  "use strict";

  let 목록 = 전설목록.slice();
  const 상태 = { state:"all", sort:"dex", gen:null, diff:null, q:"", view:"grid" };

  const $  = (s) => document.querySelector(s);
  const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
  const 봉인됨 = (m) => !!(m.주인 && String(m.주인).trim());
  const CDN = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/";
  const 스프라이트 = (m) => (이미지출처 === "cdn")
    ? `${CDN}${m.cdn || m.dex}.png`
    : `sprites/${m.이미지 || m.dex}.png`;

  /* 난이도 표시 — 막대 5개 + 등급명 */
  function 난이도표시(m, 이름표시){
    const v = m.난이도;
    const g = 난이도등급[v];
    const box = el("span", "diff" + (g ? "" : " none"));
    if (g) box.style.setProperty("--dc", g.색);

    const pips = el("span", "pips");
    for (let i = 1; i <= 5; i++){
      pips.appendChild(el("i", "pip" + (g && i <= v ? " on" : "")));
    }
    box.appendChild(pips);

    if (이름표시){
      const t = el("span", "dname");
      t.textContent = g ? g.이름 : "난이도 미정";
      box.appendChild(t);
    }
    box.title = g ? `포획 난이도 ${v} · ${g.이름}` : "포획 난이도 미정";
    return box;
  }

  /* 이미지가 없으면 도감번호로 대체 */
  function 초상(m, cls){
    const box = el("div", cls);
    const img = new Image();
    img.src = 스프라이트(m);
    img.alt = "";
    img.loading = "lazy";
    img.addEventListener("error", () => {
      img.remove();
      const f = el("span", "fallback");
      f.textContent = String(m.dex).padStart(3, "0");
      box.appendChild(f);
    });
    box.appendChild(img);
    return box;
  }

  /* ── 머리말 통계 ── */
  function 통계그리기(){
    const 총 = 목록.length;
    const 봉인 = 목록.filter(봉인됨).length;

    const rail = $("#rail");
    rail.textContent = "";
    목록.forEach((m) => {
      const t = el("div", "tick" + (봉인됨(m) ? " on" : ""));
      rail.appendChild(t);
    });

    $("#tally").innerHTML =
      `<span>등록 <b>${총}</b>종</span>` +
      `<span class="sealed">봉인 <b>${봉인}</b>종</span>` +
      `<span>미청구 <b>${총 - 봉인}</b>종</span>`;
  }

  /* ── 격자판 ── */
  function 격자그리기(){
    const board = $("#board");
    board.textContent = "";
    목록.forEach((m, i) => {
      const b = el("button", "cell" + (봉인됨(m) ? " sealed" : "") + " anim");
      b.type = "button";
      b.style.animationDelay = Math.min(i * 9, 500) + "ms";
      const dg = 난이도등급[m.난이도];
      const dtxt = dg ? ` · 난이도 ${m.난이도} ${dg.이름}` : "";
      b.title = (봉인됨(m) ? `${m.이름} — ${m.주인}` : `${m.이름} — 미청구`) + dtxt;
      b.setAttribute("aria-label", b.title);
      b.appendChild(초상(m, "sprite"));
      const lb = el("span", "label");
      lb.textContent = 봉인됨(m) ? m.주인 : m.이름;
      b.appendChild(lb);
      b.appendChild(난이도표시(m, false));
      b.addEventListener("click", () => 상세보기(m));
      board.appendChild(b);
    });
  }

  /* ── 세대 칩 ── */
  function 세대그리기(){
    const wrap = $("#gens");
    wrap.textContent = "";
    const gens = [...new Set(목록.map((m) => m.세대))].sort((a,b) => a-b);

    const mk = (label, val) => {
      const b = el("button", "gen");
      b.type = "button";
      b.textContent = label;
      b.setAttribute("aria-pressed", String(상태.gen === val));
      b.addEventListener("click", () => {
        상태.gen = (상태.gen === val) ? null : val;
        세대그리기(); 목록그리기();
      });
      return b;
    };

    wrap.appendChild(mk("전 세대", null));
    gens.forEach((g) => wrap.appendChild(mk(`${g}세대`, g)));
  }

  /* ── 난이도 칩 ── */
  function 난이도칩그리기(){
    const wrap = $("#diffs");
    if (!wrap) return;
    wrap.textContent = "";

    const mk = (label, val, 색) => {
      const b = el("button", "gen");
      b.type = "button";
      b.textContent = label;
      const on = 상태.diff === val;
      b.setAttribute("aria-pressed", String(on));
      if (on && 색){ b.style.color = 색; b.style.borderColor = 색; }
      b.addEventListener("click", () => {
        상태.diff = on ? null : val;
        난이도칩그리기(); 목록그리기();
      });
      return b;
    };

    wrap.appendChild(mk("전 난이도", null, null));
    Object.keys(난이도등급).map(Number).sort((a,b) => a-b).forEach((v) => {
      const g = 난이도등급[v];
      wrap.appendChild(mk(`${v} ${g.이름}`, v, g.색));
    });
    if (목록.some((m) => !난이도등급[m.난이도])){
      wrap.appendChild(mk("미정", 0, null));
    }
  }

  /* ── 난이도 분포 막대 ── */
  function 분포그리기(){
    const box = $("#spread");
    if (!box) return;
    box.textContent = "";

    const 칸 = (label, n, 색) => {
      const d = el("div", "seg-bar");
      const b = el("b"); b.textContent = n;
      if (색) b.style.color = 색;
      const t = document.createTextNode(label);
      d.append(b, t);
      d.style.color = "var(--muted)";
      return d;
    };

    Object.keys(난이도등급).map(Number).sort((a,b) => a-b).forEach((v) => {
      const g = 난이도등급[v];
      box.appendChild(칸(g.이름, 목록.filter((m) => m.난이도 === v).length, g.색));
    });
    const 미정 = 목록.filter((m) => !난이도등급[m.난이도]).length;
    if (미정) box.appendChild(칸("미정", 미정, null));
  }

  /* ── 티어표 ── */
  function 티어그리기(){
    const box = $("#tiers");
    if (!box) return;
    box.textContent = "";

    const 등급들 = Object.keys(난이도등급).map(Number).sort((a,b) => b-a); // 어려운 것부터
    const 행 = 등급들.map((v) => ({
      v, g: 난이도등급[v],
      멤버: 목록.filter((m) => m.난이도 === v)
    }));

    const 미정 = 목록.filter((m) => !난이도등급[m.난이도]);
    if (미정.length) 행.push({ v:null, g:null, 멤버:미정 });

    행.forEach((r, i) => {
      const row = el("div", "tier" + (r.g ? "" : " undecided") + " anim");
      row.style.animationDelay = Math.min(i * 45, 300) + "ms";

      const tag = el("div", "tier-tag");
      if (r.g) tag.style.setProperty("--tc", r.g.색);

      const rk = el("span", "rank");
      rk.textContent = r.g ? r.v : "?";
      tag.appendChild(rk);

      const nm = el("span", "rname");
      nm.textContent = r.g ? r.g.이름 : "미정";
      tag.appendChild(nm);

      const ct = el("span", "rcount");
      ct.textContent = r.멤버.length + "종";
      tag.appendChild(ct);

      row.appendChild(tag);

      const body = el("div", "tier-body");
      if (!r.멤버.length){
        const e = el("span", "tier-empty");
        e.textContent = "해당 난이도의 전설이 아직 없습니다";
        body.appendChild(e);
      } else {
        r.멤버.forEach((m) => {
          const c = el("button", "chip" + (봉인됨(m) ? " sealed" : ""));
          c.type = "button";
          c.title = 봉인됨(m) ? `${m.이름} — ${m.주인}` : `${m.이름} — 미청구`;
          c.setAttribute("aria-label", c.title);
          c.appendChild(초상(m, "sprite"));
          const t = el("span", "cname");
          t.textContent = m.이름;
          c.appendChild(t);
          c.addEventListener("click", () => 상세보기(m));
          body.appendChild(c);
        });
      }
      row.appendChild(body);
      box.appendChild(row);
    });
  }

  /* 클릭 시 아래 목록을 해당 전설로 좁힙니다 */
  function 상세보기(m){
    $("#q").value = m.이름;
    상태.q = m.이름.toLowerCase();
    목록그리기();
    const t = $("#reg-title");
    if (t && t.scrollIntoView) t.scrollIntoView({ behavior:"smooth", block:"start" });
  }

  /* ── 보기 전환 ── */
  function 보기적용(){
    const grid = 상태.view === "grid";
    $("#board").classList.toggle("hidden", !grid);
    $("#tiers").classList.toggle("hidden", grid);
    document.querySelectorAll("[data-view]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.view === 상태.view)));
  }

  /* ── 등록 카드 ── */
  function 목록그리기(){
    const reg = $("#register");
    reg.textContent = "";

    let 결과 = 목록.filter((m) => {
      if (상태.state === "open"   && 봉인됨(m)) return false;
      if (상태.state === "sealed" && !봉인됨(m)) return false;
      if (상태.gen !== null && m.세대 !== 상태.gen) return false;
      if (상태.diff !== null){
        if (상태.diff === 0){ if (난이도등급[m.난이도]) return false; }
        else if (m.난이도 !== 상태.diff) return false;
      }
      if (상태.q){
        const hay = (m.이름 + " " + (m.주인 || "")).toLowerCase();
        if (!hay.includes(상태.q)) return false;
      }
      return true;
    });

    if (상태.sort === "diff") 결과.sort((a,b) => {
      const av = 난이도등급[a.난이도] ? a.난이도 : -1;
      const bv = 난이도등급[b.난이도] ? b.난이도 : -1;
      if (av !== bv) return bv - av;      // 어려운 것부터
      return a.dex - b.dex;
    });
    else if (상태.sort === "name") 결과.sort((a,b) => a.이름.localeCompare(b.이름, "ko"));
    else if (상태.sort === "new") 결과.sort((a,b) => {
      const av = 봉인됨(a) ? (a.일시 || "0") : "";
      const bv = 봉인됨(b) ? (b.일시 || "0") : "";
      if (!av && !bv) return a.dex - b.dex;
      if (!av) return 1;
      if (!bv) return -1;
      return bv.localeCompare(av);
    });
    else 결과.sort((a,b) => a.dex - b.dex);

    $("#regcount").textContent = `${결과.length} / ${목록.length}종 표시`;

    if (!결과.length){
      const e = el("div", "empty");
      e.textContent = "조건에 맞는 전설이 없습니다. 필터를 풀거나 검색어를 지워보세요.";
      reg.appendChild(e);
      return;
    }

    결과.forEach((m, i) => {
      const card = el("article", "entry" + (봉인됨(m) ? " sealed" : "") + " anim");
      card.style.animationDelay = Math.min(i * 12, 320) + "ms";

      card.appendChild(초상(m, "portrait"));

      const meta = el("div", "meta");

      const no = el("span", "dexno");
      no.textContent = "NO." + String(m.dex).padStart(4, "0") + " · " + m.세대 + "세대";
      meta.appendChild(no);

      const h = el("h3", "name");
      h.textContent = m.이름;
      meta.appendChild(h);

      const st = el("div", "status");
      if (봉인됨(m)){
        const s = el("div", "stamp");
        const w = el("span", "who");  w.textContent = m.주인;
        s.appendChild(w);
        if (m.일시){
          const d = el("span", "when"); d.textContent = m.일시;
          s.appendChild(d);
        }
        st.appendChild(s);
      } else {
        st.innerHTML = '<span class="open">주인 없음</span><br>기믹이 열려 있습니다';
      }
      meta.appendChild(st);
      meta.appendChild(난이도표시(m, true));

      card.appendChild(meta);
      reg.appendChild(card);
    });
  }

  /* ── 소유자 ── */
  function 소유자그리기(){
    const box = $("#owners");
    box.textContent = "";

    const map = new Map();
    목록.filter(봉인됨).forEach((m) => {
      const k = String(m.주인).trim();
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(m.이름);
    });

    if (!map.size){
      const li = el("li");
      li.innerHTML = '<span class="owner-mons">아직 주인을 찾은 전설이 없습니다. 전부 열려 있습니다.</span>';
      box.appendChild(li);
      return;
    }

    [...map.entries()]
      .sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "ko"))
      .forEach(([who, mons]) => {
        const li = el("li");
        const n = el("span", "owner-name");  n.textContent = who;
        const c = el("span", "owner-count"); c.textContent = mons.length + "종";
        const l = el("span", "owner-mons");  l.textContent = mons.join(" · ");
        li.append(n, c, l);
        box.appendChild(li);
      });
  }

  /* ── 조작부 배선 ── */
  function 조작배선(){
    document.querySelectorAll("[data-view]").forEach((b) => {
      b.addEventListener("click", () => {
        상태.view = b.dataset.view;
        보기적용();
      });
    });

    document.querySelectorAll("[data-state]").forEach((b) => {
      b.addEventListener("click", () => {
        상태.state = b.dataset.state;
        document.querySelectorAll("[data-state]").forEach((x) =>
          x.setAttribute("aria-pressed", String(x === b)));
        목록그리기();
      });
    });

    document.querySelectorAll("[data-sort]").forEach((b) => {
      b.addEventListener("click", () => {
        상태.sort = b.dataset.sort;
        document.querySelectorAll("[data-sort]").forEach((x) =>
          x.setAttribute("aria-pressed", String(x === b)));
        목록그리기();
      });
    });

    let timer;
    $("#q").addEventListener("input", (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        상태.q = e.target.value.trim().toLowerCase();
        목록그리기();
      }, 120);
    });
  }

  function 전부그리기(){
    통계그리기(); 격자그리기(); 티어그리기(); 분포그리기(); 세대그리기(); 난이도칩그리기(); 목록그리기(); 소유자그리기(); 보기적용();
  }

  /* data.json 이 있으면 그쪽을 씁니다 */
  async function 시작(){
    조작배선();
    전부그리기();

    if (!JSON자동로드) return;
    try {
      const res = await fetch("data.json", { cache:"no-store" });
      if (!res.ok) return;
      const json = await res.json();
      const arr = Array.isArray(json) ? json : json.전설목록;
      if (Array.isArray(arr) && arr.length){
        목록 = arr;
        전부그리기();
      }
    } catch (_) {
      /* data.json 이 없으면 위 배열을 그대로 씁니다 */
    }
  }

  시작();
})();
</script>
</body>
</html>
